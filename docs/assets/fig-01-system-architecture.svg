<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7f9fc"/>
  <text x="700" y="48" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="28" font-weight="700" fill="#172033">面向政企场景的通用智能体安全架构</text>
  <text x="700" y="80" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="15" fill="#5c677d">以 Hook 作为平台无关的安全控制层，覆盖 RAG、Tool Use 和全链路审计</text>

  <rect x="42" y="135" width="190" height="160" rx="10" fill="#e8f1ff" stroke="#4677c7" stroke-width="2"/>
  <text x="137" y="173" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="21" font-weight="700" fill="#204b8f">输入来源</text>
  <text x="66" y="211" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">用户问题</text>
  <text x="66" y="238" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">网页内容</text>
  <text x="66" y="265" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">附件与知识库</text>

  <rect x="270" y="108" width="420" height="215" rx="12" fill="#ffffff" stroke="#2c9b87" stroke-width="3"/>
  <text x="480" y="146" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="23" font-weight="700" fill="#176b5c">通用安全 Hook 层</text>
  <rect x="300" y="170" width="165" height="55" rx="8" fill="#e8f7f3"/>
  <text x="382" y="204" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" fill="#176b5c">输入检测</text>
  <rect x="495" y="170" width="165" height="55" rx="8" fill="#e8f7f3"/>
  <text x="577" y="204" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" fill="#176b5c">检索过滤</text>
  <rect x="300" y="243" width="165" height="55" rx="8" fill="#e8f7f3"/>
  <text x="382" y="277" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" fill="#176b5c">工具前置</text>
  <rect x="495" y="243" width="165" height="55" rx="8" fill="#e8f7f3"/>
  <text x="577" y="277" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" fill="#176b5c">结果脱敏</text>

  <rect x="730" y="135" width="250" height="160" rx="10" fill="#fff4df" stroke="#d28a26" stroke-width="2"/>
  <text x="855" y="173" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="21" font-weight="700" fill="#8a5513">策略与决策</text>
  <text x="755" y="211" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#61471f">攻击检测与风险分级</text>
  <text x="755" y="238" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#61471f">RBAC 与参数校验</text>
  <text x="755" y="265" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#61471f">放行、阻断或人工审批</text>

  <rect x="1020" y="135" width="330" height="160" rx="10" fill="#f0eaff" stroke="#7659bd" stroke-width="2"/>
  <text x="1185" y="173" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="21" font-weight="700" fill="#4e3b83">模型与智能体运行层</text>
  <text x="1048" y="211" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#43356c">RAG 检索与重排</text>
  <text x="1048" y="238" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#43356c">工具调用与任务执行</text>
  <text x="1048" y="265" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#43356c">模型输出与报告生成</text>

  <rect x="270" y="400" width="420" height="190" rx="12" fill="#ffffff" stroke="#2c9b87" stroke-width="3"/>
  <text x="480" y="440" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="23" font-weight="700" fill="#176b5c">RAG 安全防护</text>
  <text x="305" y="480" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">多源输入：用户、网页、附件、知识库、历史记忆</text>
  <text x="305" y="512" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">检测：提示注入、越狱、数据投毒、敏感内容</text>
  <text x="305" y="544" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">处置：过滤污染片段、标记证据、保留安全内容</text>

  <rect x="730" y="400" width="620" height="190" rx="12" fill="#ffffff" stroke="#d28a26" stroke-width="3"/>
  <text x="1040" y="440" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="23" font-weight="700" fill="#8a5513">Tool Use 安全防护</text>
  <text x="765" y="480" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">调用前：工具注册、角色权限、参数校验、风险评分、调用链检查</text>
  <text x="765" y="512" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">执行中：沙箱、白名单、只读 SQL、异常任务链阻断、人工审批</text>
  <text x="765" y="544" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#27364d">调用后：结果脱敏、失败记录、敏感信息外发控制</text>

  <rect x="270" y="665" width="1080" height="85" rx="12" fill="#172033"/>
  <text x="810" y="705" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" font-weight="700" fill="#ffffff">统一 Trace 审计与验证</text>
  <text x="810" y="733" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="15" fill="#d9e3f5">事件记录、风险证据、调用结果、哈希链、审计完整性和回放定位</text>

  <g stroke="#5c677d" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M232 215 H270"/>
    <path d="M690 215 H730"/>
    <path d="M980 215 H1020"/>
    <path d="M480 323 V400"/>
    <path d="M1040 295 V400"/>
    <path d="M480 590 V665"/>
    <path d="M1040 590 V665"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/>
    </marker>
  </defs>
</svg>

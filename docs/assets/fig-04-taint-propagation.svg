<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>

  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f1f1f">图 1-1  跨阶段污点传播：同一动作，因上下文不同而判定不同</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#8c8c8c">各阶段在发现风险时向任务链打标，后续高风险动作的判定不仅取决于自身，还取决于所处的上下文</text>

  <!-- ============ 表头：阶段 ============ -->
  <g font-size="13" fill="#595959">
    <text x="120" y="92" text-anchor="middle">① 输入检测</text>
    <text x="320" y="92" text-anchor="middle">② 检索过滤</text>
    <text x="520" y="92" text-anchor="middle">③ 结果脱敏</text>
    <text x="750" y="92" text-anchor="middle">④ 工具调用（报告导出）</text>
  </g>

  <!-- ============ 链路 1：干净 ============ -->
  <g>
    <rect x="24" y="106" width="892" height="128" rx="8" fill="#f6ffed" stroke="#b7eb8f"/>
    <text x="42" y="130" font-size="13.5" font-weight="bold" fill="#389e0d">干净任务链</text>

    <rect x="60" y="142" width="120" height="46" rx="6" fill="#ffffff" stroke="#95de64"/>
    <text x="120" y="163" text-anchor="middle" font-size="12.5" fill="#595959">用户提问</text>
    <text x="120" y="179" text-anchor="middle" font-size="12" fill="#389e0d">放行</text>

    <path d="M186 165 L226 165" stroke="#95de64" stroke-width="2" fill="none" marker-end="url(#gArrow)"/>
    <rect x="232" y="142" width="120" height="46" rx="6" fill="#ffffff" stroke="#95de64"/>
    <text x="292" y="163" text-anchor="middle" font-size="12.5" fill="#595959">召回片段</text>
    <text x="292" y="179" text-anchor="middle" font-size="12" fill="#389e0d">无污染</text>

    <path d="M358 165 L398 165" stroke="#95de64" stroke-width="2" fill="none" marker-end="url(#gArrow)"/>
    <rect x="404" y="142" width="130" height="46" rx="6" fill="#ffffff" stroke="#95de64"/>
    <text x="469" y="163" text-anchor="middle" font-size="12.5" fill="#595959">工具返回</text>
    <text x="469" y="179" text-anchor="middle" font-size="12" fill="#389e0d">无敏感信息</text>

    <path d="M540 165 L640 165" stroke="#95de64" stroke-width="2" fill="none" marker-end="url(#gArrow)"/>
    <rect x="646" y="136" width="208" height="58" rx="6" fill="#ffffff" stroke="#52c41a" stroke-width="2"/>
    <text x="750" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#389e0d">✓ 放行</text>
    <text x="750" y="178" text-anchor="middle" font-size="11.5" fill="#8c8c8c">上下文干净，动作照常执行</text>
  </g>

  <!-- ============ 链路 2：敏感信息 ============ -->
  <g>
    <rect x="24" y="246" width="892" height="136" rx="8" fill="#fffbe6" stroke="#ffe58f"/>
    <text x="42" y="270" font-size="13.5" font-weight="bold" fill="#d48806">链路中出现敏感信息</text>

    <rect x="60" y="282" width="120" height="46" rx="6" fill="#ffffff" stroke="#ffd591"/>
    <text x="120" y="303" text-anchor="middle" font-size="12.5" fill="#595959">用户提问</text>
    <text x="120" y="319" text-anchor="middle" font-size="12" fill="#389e0d">放行</text>

    <path d="M186 305 L226 305" stroke="#ffd591" stroke-width="2" fill="none" marker-end="url(#yArrow)"/>
    <rect x="232" y="282" width="120" height="46" rx="6" fill="#ffffff" stroke="#ffd591"/>
    <text x="292" y="303" text-anchor="middle" font-size="12.5" fill="#595959">召回片段</text>
    <text x="292" y="319" text-anchor="middle" font-size="12" fill="#389e0d">无污染</text>

    <path d="M358 305 L398 305" stroke="#ffd591" stroke-width="2" fill="none" marker-end="url(#yArrow)"/>
    <rect x="392" y="274" width="154" height="62" rx="6" fill="#fff7e6" stroke="#ffa940" stroke-width="2"/>
    <text x="469" y="294" text-anchor="middle" font-size="12.5" fill="#595959">识别敏感信息并脱敏</text>
    <text x="469" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d46b08">打标 sensitive_output</text>
    <text x="469" y="328" text-anchor="middle" font-size="10.5" fill="#8c8c8c">手机号 / 邮箱 / 令牌</text>

    <path d="M540 305 L640 305" stroke="#ffa940" stroke-width="2.5" fill="none" stroke-dasharray="6 3" marker-end="url(#oArrow)"/>
    <rect x="646" y="276" width="208" height="60" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
    <text x="750" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#d46b08">⏸ 转人工审批</text>
    <text x="750" y="319" text-anchor="middle" font-size="11.5" fill="#8c8c8c">TAINT-CHAIN-002</text>
  </g>

  <!-- ============ 链路 3：污染 ============ -->
  <g>
    <rect x="24" y="394" width="892" height="136" rx="8" fill="#fff1f0" stroke="#ffccc7"/>
    <text x="42" y="418" font-size="13.5" font-weight="bold" fill="#cf1322">任务链上游检索到污染内容</text>

    <rect x="60" y="430" width="120" height="46" rx="6" fill="#ffffff" stroke="#ffa39e"/>
    <text x="120" y="451" text-anchor="middle" font-size="12.5" fill="#595959">用户提问</text>
    <text x="120" y="467" text-anchor="middle" font-size="12" fill="#389e0d">放行</text>

    <path d="M186 453 L226 453" stroke="#ffa39e" stroke-width="2" fill="none" marker-end="url(#rArrow)"/>
    <rect x="208" y="422" width="168" height="62" rx="6" fill="#fff1f0" stroke="#f5222d" stroke-width="2"/>
    <text x="292" y="442" text-anchor="middle" font-size="12.5" fill="#595959">过滤注入片段并打标</text>
    <text x="292" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#cf1322">poisoned_retrieval</text>
    <text x="292" y="476" text-anchor="middle" font-size="10.5" fill="#8c8c8c">已剔除，但污染被记住</text>

    <path d="M358 453 L398 453" stroke="#ffa39e" stroke-width="2" fill="none" marker-end="url(#rArrow)"/>
    <rect x="404" y="430" width="130" height="46" rx="6" fill="#ffffff" stroke="#ffa39e"/>
    <text x="469" y="451" text-anchor="middle" font-size="12.5" fill="#595959">工具返回</text>
    <text x="469" y="467" text-anchor="middle" font-size="12" fill="#389e0d">无敏感信息</text>

    <path d="M540 453 L640 453" stroke="#f5222d" stroke-width="2.5" fill="none" marker-end="url(#rArrow)"/>
    <rect x="646" y="424" width="208" height="60" rx="6" fill="#fff1f0" stroke="#f5222d" stroke-width="2.5"/>
    <text x="750" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#cf1322">⛔ 阻断</text>
    <text x="750" y="467" text-anchor="middle" font-size="11.5" fill="#8c8c8c">TAINT-CHAIN-001</text>
  </g>

  <!-- ============ 结论条 ============ -->
  <rect x="24" y="540" width="892" height="0" fill="none"/>

  <defs>
    <marker id="gArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#95de64"/>
    </marker>
    <marker id="yArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#ffd591"/>
    </marker>
    <marker id="oArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#ffa940"/>
    </marker>
    <marker id="rArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#f5222d"/>
    </marker>
  </defs>
</svg>
